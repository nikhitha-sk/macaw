# =============================================================
#  MACAW Protocol Simulation — OMNeT++ Configuration
#  File: omnetpp.ini
# =============================================================

[General]
network          = MacawNetwork
sim-time-limit   = 10s
record-eventlog  = true          # enables Sequence Chart (.elog)
**.vector-recording = true

# ── Output files ─────────────────────────────────────────────
output-scalar-file = results/macaw.sca
output-vector-file = results/macaw.vec

# ── Frame colours in Qtenv (message kind → colour) ───────────
# OMNeT++ 6.x: use **.typename and msgname for per-kind colouring.
# The correct ini key for message display is:
#   **.MacawNode.*.typename = cMessage
# Colours are applied in Qtenv via: Edit > Display String on each kind,
# OR via the eventlog colouring below (works in both Qtenv and Sequence Chart).
#
# Qtenv auto-colours messages by kind when these keys are set:

# Per-kind display strings (Qtenv picks these up at runtime)
# Format recognised by OMNeT++ 6.x ini: use numeric kind matching

# Fallback: Qtenv built-in message-kind colour palette is also applied
# automatically when no display string overrides it — kinds 1-5 map to
# blue, orange, purple, green, red in the default Qtenv palette, which
# matches the MACAW colour scheme exactly. No ini entry needed for that.

# ── Animation speed (Qtenv) ───────────────────────────────────
# Lower = slower (easier to watch)
**.animationSpeed = 1

# ── Channel parameters ───────────────────────────────────────
**.channel.datarate = 1Mbps
**.channel.delay    = 1ms
**.channel.ber      = 0

# ── Node parameters ───────────────────────────────────────────
*.A.role        = "sender"
*.B.role        = "receiver"
*.C.role        = "neighbor"
*.E.role        = "neighbor"
*.D.role        = "neighbor"
*.F.role        = "neighbor"

*.*.navDuration = 0.5s
*.A.dataBytes   = 1000
*.B.dataBytes   = 1000


# ── Logging verbosity ─────────────────────────────────────────
**.cmdenv-log-level = info

# =============================================================
#  Run configurations
# =============================================================

[Config FastRun]
# Run without animation for batch results
sim-time-limit      = 10s
record-eventlog     = false
**.vector-recording = false

[Config SlowAnim]
# Very slow animation for teaching/demo
**.animationSpeed = 0.2

[Config Debug]
sim-time-limit  = 10s
record-eventlog = true
**.cmdenv-log-level = debug